name: Create Release

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from CHANGELOG
        id: version
        run: |
          HEADER=$(grep -m1 '^## \[' CHANGELOG.md)

          VERSION=$(echo "$HEADER" | sed -E 's/^## \[([^]]+)\].*/\1/')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate semantic version
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version"
            exit 1
          fi

      - name: Verify PR version matches changelog version
        run: |
          CHANGELOG_VERSION="${{ steps.version.outputs.version }}"

          PR_TITLE="${{ github.event.pull_request.title }}"

          PR_VERSION=$(echo "$PR_TITLE" | sed -E 's/^Release ([0-9]+\.[0-9]+\.[0-9]+)$/\1/')

          if [ "$CHANGELOG_VERSION" != "$PR_VERSION" ]; then
            echo "Version mismatch"
            echo "PR version:        $PR_VERSION"
            echo "CHANGELOG version: $CHANGELOG_VERSION"
            exit 1
          fi

      - name: Verify version in manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          MANIFEST_VERSION=$(jq -r .version \
            custom_components/tibber_pulse_mqtt/manifest.json)

          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Manifest version mismatch"
            exit 1
          fi

      - name: Extract release notes
        run: |
          python3 <<'EOF'
          from pathlib import Path
          import re

          text = Path("CHANGELOG.md").read_text(encoding="utf-8")

          matches = list(
              re.finditer(
                  r"^## \[[^\]]+\]",
                  text,
                  re.MULTILINE,
              )
          )

          start = matches[0].start()

          if len(matches) > 1:
              end = matches[1].start()
              notes = text[start:end].rstrip()
          else:
              notes = text[start:].rstrip()

          Path("RELEASE_NOTES.md").write_text(
              notes + "\n",
              encoding="utf-8",
          )
          EOF

      - name: Create tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          gh release create \
            "v$VERSION" \
            --title "v$VERSION" \
            --notes-file RELEASE_NOTES.md