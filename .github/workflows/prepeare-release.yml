name: Prepare Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from CHANGELOG
        id: version
        shell: bash
        run: |
          HEADER=$(grep -m1 '^## \[' CHANGELOG.md)

          if [ -z "$HEADER" ]; then
            echo "No release header found in CHANGELOG.md"
            exit 1
          fi

          VERSION=$(echo "$HEADER" | sed -E 's/^## \[([^]]+)\].*/\1/')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Found version: $VERSION"

      - name: Validate semantic version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION"
            exit 1
          fi

      - name: Verify release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git fetch --tags

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            exit 1
          fi

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 1
          fi

      - name: Update manifest.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          jq \
            --arg version "$VERSION" \
            '.version = $version' \
            custom_components/tibber_pulse_mqtt/manifest.json \
            > manifest.tmp

          mv manifest.tmp custom_components/tibber_pulse_mqtt/manifest.json

      - name: Normalize top changelog header
        run: |
          python3 <<'EOF'
          from pathlib import Path
          import re

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r"^(## \[[^\]]+\]).*$",
              r"\1",
              text,
              count=1,
              flags=re.MULTILINE,
          )

          path.write_text(text, encoding="utf-8")
          EOF

      - name: Create release branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git checkout -b "release/$VERSION"

      - name: Commit release preparation
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          git add custom_components/tibber_pulse_mqtt/manifest.json

          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 1
          fi

          git commit -m "Prepare release $VERSION"

      - name: Push release branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git push origin "release/$VERSION"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          gh pr create \
            --base main \
            --head "release/$VERSION" \
            --title "Release $VERSION" \
            --body "Automated release preparation." \
            --label release